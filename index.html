 {title:'这尊造像，来自哪里？',game:'assets/match-game.webp',gameFocus:'assets/match-game-focus.webp',realFocus:'assets/match-real-focus.webp',gameCaption:'游戏：玩家从暗处走向造像',realCaption:'现实：隰县小西天大雄宝殿悬塑',statement:'造像的形态可辨认；游戏改变了光线、视角和人进入空间的方式。',hint:'寻找画面中央，造像在暗处等待被看见。',near:'这尊造像似乎有现实来源。点击看看。',hot:{x:.52,y:.45,w:.23,h:.58},source:officialSource,sourceLabel:'央视新闻客户端转载山西省文旅厅对照素材'},
 {title:'满殿悬塑，怎样进入游戏？',game:'assets/thepaper-411.webp',gameFocus:'assets/thepaper-411.webp',realFocus:'assets/thepaper-409.webp',gameCaption:'游戏：天宫楼阁与卷云构成可进入的空间',realCaption:'现实：小西天大雄宝殿的层叠悬塑',statement:'悬塑的繁密层次成为游戏空间的一部分。这里比较整体组织方式，不把某座微型楼阁硬指为唯一原型。',hint:'别只看人物，找画面里层层向上搭起的楼阁。',near:'这片楼阁与卷云值得追溯。点击看实景。',hot:{x:.48,y:.44,w:.40,h:.70},source:sculptSource,sourceLabel:'澎湃号“城市漫游计划”实景与游戏画面'},

function imageRect(){const sw=stage.clientWidth,sh=stage.clientHeight,iw=sceneImage.naturalWidth,ih=sceneImage.naturalHeight;if(!iw||!ih)return{x:0,y:0,w:sw,h:sh};const scale=getComputedStyle(sceneImage).objectFit==='cover'?Math.max(sw/iw,sh/ih):Math.min(sw/iw,sh/ih),w=iw*scale,h=ih*scale;return{x:(sw-w)/2,y:(sh-h)/2,w,h}}
